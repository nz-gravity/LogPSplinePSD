# Frozen follow-up: one saved target/reference and one unchanged guide family.
target = "exact_time_varying"
guide = "diag"
optimization_seeds = [7101, 7102, 7103]
optimization_particles = [1, 8]
checkpoints = [1000, 5000, 15000, 25000, 30000, 35000, 40000]
posterior_draws = 4096
checkpoint_draw_seed = 8301
diagnostic_seeds = [8101, 8102, 8103]
diagnostic_particles = 4096
diagnostic_chunk = 128
evaluation_seeds = [8201, 8202, 8203, 8204, 8205, 8206, 8207, 8208]
evaluation_particles = 256
mmd_count = 512
mmd_bandwidth_multipliers = [0.5, 1.0, 2.0]

# Descriptive optimization tolerances, separate from posterior-accuracy flags.
# Require both final intervals (30000->35000 and 35000->40000), all features,
# and all three seed pairs. Objective changes must also fit a paired MC band.
stability_steps = [30000, 35000, 40000]
mean_drift_tolerance_reference_sd = 0.1
relative_sd_drift_tolerance = 0.05
event_drift_tolerance = 0.01
objective_change_tolerance = 0.2
objective_mcse_multiplier = 2.0

[[schedules]]
name = "constant_0.01"
type = "constant"
peak_lr = 0.01

[[schedules]]
name = "constant_0.003"
type = "constant"
peak_lr = 0.003

[[schedules]]
name = "warmup_cosine"
type = "warmup_cosine"
peak_lr = 0.01
initial_lr = 0.001
warmup_steps = 1000
end_lr = 0.0001
