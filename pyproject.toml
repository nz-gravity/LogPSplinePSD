[build-system]
requires = [
    "setuptools>=64",
    "setuptools-scm>=8.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "LogPSplinePSD"
dynamic = ["version"]
requires-python = ">=3.12"
description = "LogPsplines in JAX"
readme = "README.rst"
authors = [
    { name = "Avi Vajpeyi", email = "avi.vajpeyi@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "jax",
    "jaxtyping>=0.3.9",
    "optax",
    "numpy",
    "matplotlib",
    "tqdm",
    "numpyro",
    "h5py",
    "arviz-base[zarr,netcdf4]",
    "arviz-stats",
    "arviz-plots[matplotlib]",
    "xarray[io,accel]",
    "click",
    "ipywidgets",
    "plotly",
    "morphz",
    "loguru",
    "scikit-fda",
    # scikit-fda's generic operator registrations are incompatible with
    # multimethod 2.x on some supported Python/platform combinations.
    "multimethod>=1.12,<2"
]

[project.optional-dependencies]
wdm = ["wdm-transform>=0.5.0"]
typecheck = [
    "beartype>=0.22.9",
]
dev = [
    "LogPSplinePSD[typecheck]",
    "pytest",
    "pytest-cov",
    "pytest-memray",
    "pytest-durations",
    "ruff",
    "mypy",
    "jupyter-book<2.0",
    "prek",
    "GitPython",
    "vulture"
]

[project.urls]
"Homepage" = "https://nz-gravity.github.io/LogPSplinePSD/"
"Bug Reports" = "https://github.com/nz-gravity/LogPSplinePSD/issues"
"Source" = "https://github.com/nz-gravity/LogPSplinePSD/"

[project.scripts]
log_psplines_benchmark = "log_psplines.benchmark.cli:main"

[tool.setuptools_scm]
version_file = "src/log_psplines/_version.py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"log_psplines" = [""]

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src"]

[tool.ruff.format]
# Formats docstrings and comments to respect line-length = 79
docstring-code-format = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["log_psplines"]

# Ruff parses jaxtyping's quoted dimension strings as Python forward references.
[tool.ruff.lint.per-file-ignores]
"src/log_psplines/basis/penalty.py" = ["F722", "F821", "UP037"]
"src/log_psplines/data/spectral.py" = ["F722", "F821", "UP037"]
"src/log_psplines/data/spectral_utils.py" = ["F722", "F821", "UP037"]
"src/log_psplines/inference/initialisation.py" = ["F722", "F821", "UP037"]
"src/log_psplines/inference/power.py" = ["F722", "F821", "UP037"]
"src/log_psplines/likelihoods/whittle.py" = ["F722", "F821", "UP037"]
"src/log_psplines/likelihoods/wishart.py" = ["F722", "F821", "UP037"]
"src/log_psplines/models/matrix.py" = ["F722", "F821", "UP037"]
"src/log_psplines/models/reconstruction.py" = ["F722", "F821", "UP037"]
"src/log_psplines/models/spectrum.py" = ["F722", "F821", "UP037"]
"src/log_psplines/preprocessing/coarse_grain.py" = ["F722", "F821", "UP037"]
"src/log_psplines/preprocessing/moving_periodogram.py" = ["F722", "F821", "UP037"]
"src/log_psplines/preprocessing/periodogram.py" = ["F722", "F821", "UP037"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--durations=10 --strict-markers --import-mode=importlib --jaxtyping-packages=log_psplines,beartype.beartype"
markers = [
    "slow: slow integration or end-to-end tests",
    "memory: tests commonly used for memory profiling runs",
]

[tool.coverage.run]
branch = true
source = ["log_psplines"]
omit = [
    "src/log_psplines/_version.py",
    "src/log_psplines/logger.py",
    "src/log_psplines/benchmark/*",
    "src/log_psplines/example_datasets/lvk_data.py",
    "src/log_psplines/preprocessing/knots_locator/lvk_knot_allocator.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]
ignore_errors = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
show_error_codes = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "scipy.*",
    "numba.*",
    "bilby.*",
    "arviz.*",
    "arviz_plots.*",
    "requests.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "log_psplines.example_datasets.lisatools_backend",
    "log_psplines.example_datasets.lisa_data",
    "log_psplines.example_datasets.lvk_data",
    "log_psplines.example_datasets.utils",
    "log_psplines.example_datasets.varma_data",
    "log_psplines.samplers.vi_init.core",
    "log_psplines.samplers.vi_init.mixin",
    "log_psplines.samplers.vi_init.adapters",
    "log_psplines.diagnostics.vi_psis",
    "log_psplines.diagnostics.plotting",
    "log_psplines.diagnostics.posterior_diagnostics",
    "log_psplines.diagnostics.derived_weights",
    "log_psplines.diagnostics.mcmc",
    "log_psplines.samplers.univar.univar_base",
    "log_psplines.samplers.univar.nuts",
    "log_psplines.samplers.utils",
    "log_psplines.samplers.base_sampler",
    "log_psplines.samplers.multivar.multivar_base",
    "log_psplines.samplers.multivar.multivar_blocked_nuts",
    "log_psplines.inference.initialisation",
    "log_psplines.inference.components",
    "log_psplines.benchmark.runtime_benchmark",
]
disable_error_code = ["import-untyped", "import-not-found"]
ignore_errors = true

[tool.vulture]
paths = ["src/", "tests/", "docs/"]
min_confidence = 80

[tool.semantic_release]
version_variable = "src/log_psplines/_version.py:__version__"
version_source = "commit"
commit_version_number = true
commit_subject = "chore(release): {version}"
commit_message = "chore(release): {version}"
tag_format = "v{version}"
no_local_version = true

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.rst"
